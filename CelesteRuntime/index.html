    <script>
        (() => {
            const syncBridge = (command, params = {}) => {
                try {
                    const query = new URLSearchParams(params).toString();
                    const xhr = new XMLHttpRequest();
                    xhr.open("GET", "/__android_bridge/" + encodeURIComponent(command) + (query ? "?" + query : ""), false);
                    xhr.send();
                    return xhr.status >= 200 && xhr.status < 300 ? xhr.responseText || "" : "";
                } catch {
                    return "";
                }
            };
            const showDialog = (dialog) => {
                try {
                    if (dialog && !dialog.open) dialog.showModal();
                } catch {
                }
            };
            const touch = { x: -1, y: -1, down: false, tapped: false, scroll: 0, id: null, dragged: false, startX: 0, startY: 0 };
            const gamePoint = event => {
                const rect = document.querySelector('canvas')?.getBoundingClientRect();
                if (!rect) return { x: -1, y: -1 };
                const scale = Math.min(rect.width / 1920, rect.height / 1080);
                return { x: (event.clientX - rect.left - (rect.width - 1920 * scale) / 2) / scale,
                    y: (event.clientY - rect.top - (rect.height - 1080 * scale) / 2) / scale };
            };
            const isGameTouch = event => !event.target.closest?.('#celeste-touch-controls,dialog,input,button');
            const setTouch = (event) => {
                const point = gamePoint(event);
                touch.x = point.x; touch.y = point.y;
            };
            addEventListener("pointermove", event => {
                if (!isGameTouch(event)) return;
                const previousY = touch.y;
                setTouch(event);
                if (touch.down && touch.id === event.pointerId) {
                    if (Math.hypot(touch.x-touch.startX,touch.y-touch.startY)>16) touch.dragged=true;
                    if (touch.dragged) touch.scroll += touch.y - previousY;
                }
            }, { passive: true });
            addEventListener("pointerdown", (event) => {
                if (!isGameTouch(event)) return;
                setTouch(event);
                touch.id=event.pointerId; touch.down=true; touch.dragged=false; touch.tapped=false;
                touch.startX=touch.x; touch.startY=touch.y;
            }, { passive: true });
            addEventListener("pointerup", (event) => {
                if(touch.id!==event.pointerId) return;
                setTouch(event);
                touch.down = false; touch.id=null;
                touch.tapped = !touch.dragged;
            }, { passive: true });
            addEventListener("pointercancel", () => {
                touch.down = false; touch.id=null; touch.tapped=false;
            }, { passive: true });
            addEventListener("wheel", (event) => {
                if (isGameTouch(event)) touch.scroll -= event.deltaY;
            }, { passive: true });
            let lastHapticAt = 0;
            window.celesteAndroidHaptic = (strength, length) => {
                const now = performance.now();
                if (now - lastHapticAt < 45) return;
                lastHapticAt = now;
                const query = new URLSearchParams({ strength, length });
                fetch("/__android_bridge/haptic?" + query, { cache: "no-store" }).catch(() => {});
            };
            let physicalKeyboardSeen = false;
            addEventListener("keydown", event => {
                if (event.isTrusted && !["Shift", "Control", "Alt", "Meta"].includes(event.key)) physicalKeyboardSeen = true;
            }, true);
            window.celesteAndroidPhysicalKeyboardSeen = () => physicalKeyboardSeen;
            window.celesteAndroidOpenUrl = (url) => syncBridge("openUrl", { url });
            window.celesteAndroidOpenModBrowser = () => {
                window.celesteOpenModManager?.();
            };
            window.celesteAndroidOpenSaveData = () => {
                if (window.app?.savesmenu) showDialog(window.app.savesmenu);
            };
            window.celesteAndroidExportSave = () => window.celesteDownloadSave?.();
            window.celesteAndroidLoadSave = () => window.celesteAndroidOpenSaveData();
            window.celesteAndroidOpenFileManager = () => {
                if (window.app?.fs) showDialog(window.app.fs);
            };
            window.celesteAndroidOpenLayoutEditor = () => window.dispatchEvent(new CustomEvent("celeste-open-layout-editor"));
            window.celesteAndroidSetOption = (key, value) => {
                try { localStorage.setItem("celeste.option." + key, String(value)); } catch {}
                window.dispatchEvent(new CustomEvent('celeste-option-changed', {detail:{key,value}}));
            };
            const controlOptions = new Map();
            window.celesteQueueControlOption=(key,value)=>controlOptions.set(key,value);
            window.celesteAndroidConsumeOptions=()=>{
                const result=Array.from(controlOptions,([key,value])=>key+'='+value).join('|');
                controlOptions.clear();return result;
            };
            window.celesteAndroidConsumeTouchTap = () => {
                const tapped = touch.tapped;
                touch.tapped = false;
                return tapped;
            };
            window.celesteAndroidTouchX = () => touch.x;
            window.celesteAndroidTouchY = () => touch.y;
            window.celesteAndroidTouchDown = () => touch.down;
            window.celesteAndroidConsumeTouchScroll = () => {
                const scroll = touch.scroll;
                touch.scroll = 0;
                return scroll;
            };
            window.celesteAndroidStartCelesteNetHost = (port) => syncBridge("startHost", { port }) === "1";
            window.celesteAndroidStopCelesteNetHost = () => syncBridge("stopHost");
            window.celesteAndroidIsCelesteNetHostRunning = () => syncBridge("isHostRunning") === "1";
            window.celesteAndroidGetCelesteNetServers = () => syncBridge("getServers");
        })();
    </script>
    <script>
        (() => {
            const levels = ["debug", "log", "info", "warn", "error"];
            const originals = {};
            const serialize = (value) => {
                if (value instanceof Error) return value.stack || value.message || String(value);
                if (typeof value === "string") return value;
                try { return JSON.stringify(value); } catch { return String(value); }
            };
            const send = (level, args) => {
                try {
                    const message = Array.from(args).map(serialize).join(" ").slice(0, 1800);
                    if (!window.__celesteAndroidRendered && message.startsWith("[android-port] frame confirmed ")) {
                        window.__celesteAndroidRendered = true;
                        setTimeout(() => window.celesteForceGameVisible?.(), 0);
                    } else if (!window.__celesteAndroidRendered && message.startsWith("GAME DISPLAYED")) {
                        window.celesteSetBootStatus?.("Waiting for the first rendered frame…");
                    }
                    fetch("/__android_port_log?level=" + encodeURIComponent(level) + "&msg=" + encodeURIComponent(message), { cache: "no-store" }).catch(() => {});
                } catch (e) {
                    originals.log("Log error:", e);
                }
            };
            for (const level of levels) {
                originals[level] = console[level] ? console[level].bind(console) : console.log.bind(console);
                console[level] = (...args) => {
                    send(level, args);
                    originals[level](...args);
                };
            }
            window.androidPortLog = (level, ...args) => send(level || "log", args);
        })();
    </script>
    <script type="module">
        const prepareCanvas = (canvas = document.getElementById("canvas") || document.querySelector("canvas"), options = {}) => {
            if (!(canvas instanceof HTMLCanvasElement)) {
                canvas = document.getElementById("canvas") || document.querySelector("canvas");
            }
            if (!canvas) return null;
            if (options.resizeBacking) {
                const width = Math.max(1, Math.floor(window.innerWidth || document.documentElement.clientWidth || 1280));
                const height = Math.max(1, Math.floor(window.innerHeight || document.documentElement.clientHeight || 720));
                try {
                    if (canvas.width !== width) canvas.width = width;
                    if (canvas.height !== height) canvas.height = height;
                    console.info(`[android-port] prepared canvas backing ${canvas.width}x${canvas.height}`);
                } catch (err) {
                    console.warn("[android-port] initial canvas backing resize failed", err);
                }
            }
            canvas.style.position = "fixed";
            canvas.style.inset = "0";
            canvas.style.width = "100vw";
            canvas.style.height = "100vh";
            canvas.style.zIndex = "2147483646";
            canvas.style.display = "block";
            canvas.style.background = "#000";
            canvas.style.opacity = "1";
            canvas.style.visibility = "visible";
            if (!canvas.__celesteAndroidContextLogging) {
                canvas.addEventListener("webglcontextlost", (event) => {
                    event.preventDefault();
                    console.error("[android-port] WebGL context lost");
                }, false);
                canvas.addEventListener("webglcontextrestored", () => {
                    console.warn("[android-port] WebGL context restored");
                }, false);
                canvas.__celesteAndroidContextLogging = true;
            }
            return canvas;
        };
        window.celestePrepareCanvas = prepareCanvas;
        const forceGameVisible = () => {
            if (!window.__celesteAndroidRendered) return;
            document.body.classList.add('playing');
            document.body.classList.add('game-rendered');
            document.getElementById("static-boot")?.remove();
            document.querySelectorAll("#boot-status-label").forEach((label) => {
                const root = label.closest("main");
                if (root && !root.querySelector("canvas")) {
                    root.remove();
                }
            });
            document.querySelectorAll("canvas").forEach((canvas) => prepareCanvas(canvas, { resizeBacking: false }));
        };
        window.celesteForceGameVisible = forceGameVisible;
        window.celesteLogCanvasState = (tag = "canvas") => {
            try {
                const canvas = document.querySelector("canvas");
                if (!canvas) {
                    console.warn(`[android-port] ${tag}: no canvas`);
                    return;
                }
                const rect = canvas.getBoundingClientRect();
                let pixel = "unread";
                try {
                    const gl = canvas.controlTransferredOffscreen ? null : canvas.getContext("webgl2") || canvas.getContext("webgl");
                    if (gl) {
                        const lost = typeof gl.isContextLost === "function" && gl.isContextLost();
                        if (lost) {
                            pixel = "context-lost";
                        } else {
                            const rgba = new Uint8Array(4);
                            gl.readPixels(
                                Math.max(0, Math.floor(gl.drawingBufferWidth / 2)),
                                Math.max(0, Math.floor(gl.drawingBufferHeight / 2)),
                                1,
                                1,
                                gl.RGBA,
                                gl.UNSIGNED_BYTE,
                                rgba
                            );
                            pixel = `${rgba[0]},${rgba[1]},${rgba[2]},${rgba[3]}`;
                        }
                    } else {
                        pixel = canvas.controlTransferredOffscreen ? "worker-owned (see frame confirmation)" : "no-webgl";
                    }
                } catch (readErr) {
                    pixel = "read-error:" + (readErr.message || String(readErr));
                }
                console.info(
                    `[android-port] ${tag}: canvas attr=${canvas.width}x${canvas.height} ` +
                    `css=${Math.round(rect.width)}x${Math.round(rect.height)} ` +
                    `display=${getComputedStyle(canvas).display} visibility=${getComputedStyle(canvas).visibility} ` +
                    `pixel=${pixel}`
                );
            } catch (err) {
                console.warn("[android-port] canvas diagnostic failed", err);
            }
        };
        const setBootStatus = (text, error = false) => {
            for (const status of document.querySelectorAll("#static-boot-status, #boot-status-label")) {
                status.textContent = text;
                status.classList.toggle("error", error === true);
                status.style.color = error === true ? "#ff6b6b" : "";
            }
        };
        window.celesteSetBootStatus = setBootStatus;
        window.addEventListener("error", (event) => setBootStatus("Startup error: " + event.message, true));
        window.addEventListener("unhandledrejection", (event) => {
            const reason = event.reason && (event.reason.message || String(event.reason));
            setBootStatus("Startup error: " + (reason || "unknown"), true);
        });
        async function startBundleWhenIsolated() {
            await cleanupLegacyServiceWorkers();
            if (typeof SharedArrayBuffer === "undefined") {
                await new Promise((resolve) => setTimeout(resolve, 1200));
            }

            if (typeof SharedArrayBuffer === "undefined") {
                throw new Error(
                    "SharedArrayBuffer unavailable. " +
                    "url=" + location.href + " " +
                    "secure=" + window.isSecureContext + " " +
                    "isolated=" + window.crossOriginIsolated + " " +
                    "server=" + (window.WEBVIEW_SERVER_URL || "unset")
                );
            }

            await cleanupLegacyPackagedOpfs();
            await import("./bundle.js");
        }


        async function cleanupLegacyServiceWorkers() {
            if (!navigator.serviceWorker) return;
            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map((registration) => registration.unregister()));
                if (window.caches && caches.keys) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map((key) => caches.delete(key)));
                }
                if (navigator.serviceWorker.controller && !sessionStorage.getItem("androidSwCleanupReloaded")) {
                    sessionStorage.setItem("androidSwCleanupReloaded", "1");
                    location.reload();
                    await new Promise(() => {});
                }
            } catch (err) {
                console.warn("Service worker cleanup skipped:", err);
            }
        }
        async function cleanupLegacyPackagedOpfs() {
            if (!navigator.storage || !navigator.storage.getDirectory) return;
            try {
                const root = await navigator.storage.getDirectory();
                await removeIfExists(root, "Content", true);
                await removeIfExists(root, "Celeste.dll", false);
                await removeIfExists(root, "CustomCeleste.dll", false);
                await removeIfExists(root, "Celeste.Mod.mm.dll", false);
                await removeIfExists(root, "MMHOOK_Celeste.dll", false);
                await removeIfExists(root, "everest.zip", false);
                const celeste = await getDirectoryIfExists(root, "Celeste");
                if (celeste) {
                    await removeIfExists(celeste, "Everest", true);
                }
            } catch (err) {
                console.warn("Packaged OPFS cleanup skipped:", err);
            }
        }

        async function getDirectoryIfExists(parent, name) {
            try {
                return await parent.getDirectoryHandle(name);
            } catch {
                return null;
            }
        }

        async function removeIfExists(parent, name, recursive) {
            try {
                await parent.removeEntry(name, { recursive });
            } catch {
            }
        }

        function activateGameMode() {
            forceGameVisible();
            window.scrollTo(0, 0);
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
        }

        startBundleWhenIsolated().catch((err) => {
            console.error(err);
            setBootStatus("Startup error: " + (err.message || String(err)), true);
        });
    </script>
</head>

<body>
<div id="static-boot">
    <p id="static-boot-status"></p>
    <div class="static-boot-bar"><div></div></div>
</div>

<style>
    /* OPTIMIZED RENDERING */
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #000;
        overflow: hidden !important;
        touch-action: auto; user-select: none; -webkit-user-select: none;
        position: fixed; transform: translateZ(0);
        -webkit-tap-highlight-color: transparent;
    }

    #static-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
            linear-gradient(rgba(0, 0, 0, 0.56), rgba(0, 0, 0, 0.64)),
            url("assets/mountain.png") center / cover no-repeat #000;
        color: #fff;
        font: 600 18px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
    }

    #static-boot-status {
        margin: 0;
    }

    #static-boot-status.error {
        max-width: min(86vw, 720px);
        color: #ff6b6b;
        font-size: 15px;
        line-height: 1.35;
    }

    .static-boot-bar {
        width: min(72vw, 460px);
        height: 12px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.82);
        background: rgba(255, 255, 255, 0.12);
    }

    .static-boot-bar > div {
        width: 42%;
        height: 100%;
        background: #fff;
        animation: staticBootProgress 1.15s ease-in-out infinite alternate;
    }

    @keyframes staticBootProgress {
        from { transform: translateX(-95%); }
        to { transform: translateX(235%); }
    }
    
    canvas {
        touch-action: none;
        display: block; margin: 0 auto;
        width: 100% !important; height: 100% !important;
        object-fit: contain; z-index: 1;
        image-rendering: pixelated; 
        will-change: transform; transform: translateZ(0);
    }

    /* Hide Site UI */
    .fps, .logs, .header, .title, .version, .icon, header, footer, .log-container {
        display: none !important; opacity: 0 !important; pointer-events: none !important;
        width: 0 !important; height: 0 !important; position: absolute !important;
    }
    body.playing .top-bar,
    body.playing footer,
    body.playing .header-controls,
    body.playing #header,
    body.playing .logs,
    body.playing h1,
    body.playing .info > p:not(#boot-status-label) {
        display: none !important;
    }
    body.game-rendered #static-boot {
        display: none !important;
    }
    body:not(.game-rendered) main:has(#boot-status-label) {
        z-index: 2147483647 !important;
    }
    body:has(#static-boot):not(.game-rendered) main:has(#boot-status-label) {
        /* The static overlay owns startup text; avoid two labels overlapping. */
        visibility: hidden !important;
    }
    body.playing canvas { position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; width: 100vw !important; height: 100vh !important; z-index: 2147483646 !important; background: #000; opacity: 1 !important; visibility: visible !important; }
</style>

<script>
    (function() {
        // MOBILE CONTROLS AND KERNEL OPTIMIZATIONS
        try { Object.defineProperty(window, 'devicePixelRatio', { get: function() { return 1; } }); } catch(e) {}
        
        try {
            const originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, attributes) {
                if (type.includes('webgl')) {
                    attributes = attributes || {};
                    attributes.alpha = false;                 
                    attributes.desynchronized = false;
                    attributes.powerPreference = "high-performance";
                    attributes.preserveDrawingBuffer = true;
                    attributes.antialias = false;
                }
                const context = originalGetContext.call(this, type, attributes);
                if (context && !context.__celesteAndroidPatchedExtensions) {
                    const flakyFloatRenderTargetExtensions = new Set([
                        "EXT_color_buffer_float",
                        "EXT_color_buffer_half_float",
                        "WEBGL_color_buffer_float",
                        "WEBGL_color_buffer_half_float"
                    ]);
                    const originalGetExtension = context.getExtension.bind(context);
                    context.getExtension = (name) => {
                        if (flakyFloatRenderTargetExtensions.has(name)) {
                            console.warn("[android-port] disabling flaky WebGL float render target extension: " + name);
                            return null;
                        }
                        return originalGetExtension(name);
                    };
                    const originalGetSupportedExtensions = context.getSupportedExtensions?.bind(context);
                    if (originalGetSupportedExtensions) {
                        context.getSupportedExtensions = () => {
                            const extensions = originalGetSupportedExtensions() || [];
                            return extensions.filter((name) => !flakyFloatRenderTargetExtensions.has(name));
                        };
                    }
                    context.__celesteAndroidPatchedExtensions = true;
                }
                return context;
            };
        } catch(e) {}

        try {
            const originalAudioContext = window.AudioContext || window.webkitAudioContext;
            if (originalAudioContext) {
                window.AudioContext = window.webkitAudioContext = function(options) {
                    options = options || {};
                    return new originalAudioContext({ latencyHint: 'balanced', sampleRate: 44100 });
                };
            }
        } catch(e) {}

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('button') || e.target.closest('.action');
            if (btn) {
                const text = btn.innerText.toLowerCase().trim();
                const html = btn.innerHTML.toLowerCase();
                if (text.includes("start game") || (html.includes("play_arrow") && !text.includes("download"))) {
                    setTimeout(() => {
                        document.body.classList.add('playing');
                        window.scrollTo(0, 0);
                        if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
                    }, 200);
                }
            }
        }, true);
    })();
</script>
